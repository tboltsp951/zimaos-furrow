<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Furrow — Garden Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --forest:#1F3B2C;
    --forest-deep:#142A1E;
    --sage:#6B8F71;
    --sage-light:#A8C0A5;
    --gold:#E3B23C;
    --clay:#A8562E;
    --clay-light:#C97E52;
    --parchment:#F2EEE1;
    --parchment-line:#E1DAC4;
    --ink:#23281F;
    --ink-soft:#5B5F52;
    --white:#FFFDF8;
  }

  *{box-sizing:border-box;}
  body{margin:0;background:var(--parchment);color:var(--ink);font-family:'Inter',sans-serif;}
  .app{min-height:100vh;display:flex;flex-direction:column;}

  /* ---------- Header ---------- */
  .topbar{
    background:var(--forest);
    color:var(--white);
    padding:22px 32px;
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    border-bottom:4px solid var(--gold);
  }
  .brand{display:flex;align-items:baseline;gap:12px;}
  .brand-mark{
    font-family:'Fraunces',serif;
    font-weight:700;
    font-size:28px;
    letter-spacing:-0.01em;
    cursor:text;
    border-bottom:1px dashed transparent;
  }
  .brand-mark:hover{border-bottom-color:var(--sage-light);}
  .brand-mark span{color:var(--gold);}
  .brand-input{
    font-family:'Fraunces',serif;
    font-weight:700;
    font-size:28px;
    background:transparent;
    border:none;
    border-bottom:1px solid var(--gold);
    color:var(--white);
    padding:0;
    width:auto;
  }
  .brand-input:focus{outline:none;}
  .tagline{font-size:13px;color:var(--sage-light);font-style:italic;font-family:'Fraunces',serif;}
  .save-status{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--sage-light);opacity:.85;}
  .topbar-actions{display:flex;align-items:center;gap:10px;}
  .header-btn{
    background:transparent;
    border:1px solid var(--sage);
    color:var(--sage-light);
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:12px;
    padding:6px 12px;
    border-radius:20px;
    cursor:pointer;
  }
  .header-btn:hover{background:rgba(255,255,255,0.08);color:var(--white);border-color:var(--gold);}

  /* ---------- Nav ---------- */
  .nav{
    display:flex;
    gap:2px;
    background:var(--forest-deep);
    padding:0 32px;
  }
  .nav button{
    background:transparent;
    border:none;
    color:var(--sage-light);
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:14px;
    padding:14px 20px;
    cursor:pointer;
    border-bottom:3px solid transparent;
    transition:all .15s ease;
  }
  .nav button:hover{color:var(--white);}
  .nav button.active{color:var(--white);border-bottom-color:var(--gold);}

  main{flex:1;padding:32px;max-width:1200px;margin:0 auto;width:100%;}

  h2.section-title{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:26px;
    margin:0 0 4px 0;
    color:var(--forest);
  }
  .section-sub{color:var(--ink-soft);font-size:14px;margin:0 0 24px 0;}

  /* ---------- Cards / panels ---------- */
  .panel{
    background:var(--white);
    border:1px solid var(--parchment-line);
    border-radius:4px;
    padding:20px;
  }
  .row{display:flex;gap:24px;flex-wrap:wrap;}
  .col{flex:1;min-width:280px;}

  label{display:block;font-size:12px;font-weight:600;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.04em;margin-bottom:5px;}
  input, select, textarea{
    width:100%;
    border:1px solid var(--parchment-line);
    background:var(--parchment);
    padding:9px 10px;
    border-radius:3px;
    font-family:'Inter',sans-serif;
    font-size:14px;
    color:var(--ink);
  }
  input:focus, select:focus, textarea:focus{outline:2px solid var(--sage);outline-offset:1px;}
  .field{margin-bottom:14px;}

  button.btn{
    background:var(--forest);
    color:var(--white);
    border:none;
    padding:10px 18px;
    border-radius:3px;
    font-weight:600;
    font-size:14px;
    cursor:pointer;
    font-family:'Inter',sans-serif;
  }
  button.btn:hover{background:var(--forest-deep);}
  button.btn.clay{background:var(--clay);}
  button.btn.clay:hover{background:#8C4623;}
  button.btn.ghost{background:transparent;color:var(--forest);border:1px solid var(--forest);}
  button.btn.ghost:hover{background:var(--forest);color:var(--white);}
  button.btn.sm{padding:6px 12px;font-size:12.5px;}
  button.btn:disabled{opacity:.4;cursor:not-allowed;}

  /* ---------- Beds tab ---------- */
  .bed-list{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px;}
  .bed-chip{
    padding:8px 14px;
    border-radius:20px;
    border:1px solid var(--sage);
    background:var(--white);
    cursor:pointer;
    font-size:13px;
    font-weight:600;
    color:var(--forest);
  }
  .bed-chip.active{background:var(--forest);color:var(--white);border-color:var(--forest);}

  .plant-palette{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px;}
  .plant-tag{
    display:flex;align-items:center;gap:6px;
    padding:6px 10px;
    border-radius:3px;
    border:1.5px solid transparent;
    background:var(--parchment);
    cursor:pointer;
    font-size:12.5px;
    font-weight:600;
  }
  .plant-tag.selected{border-color:var(--ink);background:var(--white);}
  .swatch{width:12px;height:12px;border-radius:2px;flex-shrink:0;}

  .grid-wrap{overflow:auto;border:1px solid var(--parchment-line);background:
    repeating-linear-gradient(0deg, transparent, transparent 97px, var(--parchment-line) 97px, var(--parchment-line) 98px),
    repeating-linear-gradient(90deg, transparent, transparent 97px, var(--parchment-line) 97px, var(--parchment-line) 98px),
    var(--white);
    padding:1px;
    display:inline-block;
  }
  .bed-grid{border-collapse:collapse;}
  .bed-grid td{
    width:98px;height:98px;
    border:0;
    cursor:pointer;
    text-align:center;
    vertical-align:middle;
    font-size:38px;
    font-weight:700;
    color:var(--white);
    position:relative;
  }
  .bed-grid td .cell-fill{
    position:absolute;inset:5px;
    border-radius:7px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    line-height:1.05;
  }
  .bed-grid td .cell-fill.merged{inset:0;border-radius:0;}
  .bed-grid td .cell-fill .sq-count{font-size:0.4em;font-weight:600;opacity:.9;margin-top:1px;}
  .bed-grid td:hover .cell-fill{outline:3px solid var(--gold);}
  .bed-grid td[draggable="true"]{cursor:grab;}
  .bed-grid td.dragging .cell-fill{opacity:.35;}
  .bed-grid td.drag-over .cell-fill{outline:3px dashed var(--gold);outline-offset:-3px;}

  .bed-meta{display:flex;gap:20px;margin-top:16px;font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--ink-soft);align-items:center;}

  /* ---------- Library tab ---------- */
  .plant-grid{display:grid;grid-template-columns:repeat(auto-fill, minmax(240px,1fr));gap:14px;}
  .plant-card{
    background:var(--white);
    border:1px solid var(--parchment-line);
    border-left:5px solid var(--sage);
    border-radius:3px;
    padding:14px;
  }
  .plant-card h4{margin:0 0 6px 0;font-family:'Fraunces',serif;font-size:17px;color:var(--forest);}
  .plant-variety{font-size:12px;font-style:italic;color:var(--clay);margin:-4px 0 8px 0;}
  .plant-card .meta-line{font-size:12px;color:var(--ink-soft);margin:3px 0;display:flex;gap:6px;}
  .plant-card .meta-line b{color:var(--ink);font-weight:600;}
  .card-actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;align-items:center;}
  .card-actions select{width:auto;flex:1;min-width:110px;padding:6px 8px;font-size:12.5px;}
  .search-bar{margin-bottom:18px;max-width:340px;}
  .library-toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;flex-wrap:wrap;gap:12px;}
  .edit-form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
  .edit-form-grid .field{margin-bottom:6px;}
  .tender-toggle{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-soft);margin:8px 0;}
  .tender-toggle input{width:auto;}
  .add-plant-panel{margin-bottom:22px;}

  /* ---------- Calendar tab ---------- */
  .frost-inputs{display:flex;gap:16px;margin-bottom:24px;flex-wrap:wrap;align-items:flex-end;}
  .frost-inputs .field{margin-bottom:0;min-width:180px;}
  table.cal-table{width:100%;border-collapse:collapse;font-size:13px;}
  table.cal-table th{
    text-align:left;padding:10px 12px;
    background:var(--forest);color:var(--white);
    font-size:11px;text-transform:uppercase;letter-spacing:.04em;
    position:sticky;top:0;
  }
  table.cal-table td{padding:10px 12px;border-bottom:1px solid var(--parchment-line);}
  table.cal-table tr:hover{background:var(--parchment);}

  /* ---------- Table / Year Calendar toggle ---------- */
  .view-toggle{display:flex;gap:6px;margin-bottom:18px;}
  .view-toggle button{
    background:var(--white);border:1px solid var(--sage);color:var(--forest);
    font-weight:600;font-size:12.5px;padding:7px 14px;border-radius:20px;cursor:pointer;
  }
  .view-toggle button.active{background:var(--forest);color:var(--white);border-color:var(--forest);}

  /* ---------- Year calendar ---------- */
  .year-legend{display:flex;flex-wrap:wrap;gap:20px;margin-bottom:18px;font-size:12px;color:var(--ink-soft);align-items:center;}
  .year-legend-group{display:flex;flex-wrap:wrap;gap:8px;align-items:center;}
  .year-legend-badge{
    display:inline-flex;align-items:center;justify-content:center;
    width:16px;height:16px;border-radius:3px;background:var(--forest);color:var(--white);
    font-size:10px;font-weight:700;margin-right:2px;
  }
  .year-legend-plant{display:inline-flex;align-items:center;gap:4px;background:var(--white);border:1px solid var(--parchment-line);padding:2px 8px;border-radius:20px;}

  .year-rows{display:flex;flex-direction:column;gap:0;background:var(--white);border:1px solid var(--parchment-line);border-radius:4px;padding:24px;overflow-x:auto;}
  .month-row{display:flex;align-items:stretch;gap:20px;min-width:1280px;border-bottom:1px solid var(--parchment-line);padding:6px 0;}
  .month-row:last-child{border-bottom:none;}
  .month-row-label{
    width:120px;flex-shrink:0;
    display:flex;align-items:center;
    font-family:'Fraunces',serif;font-weight:600;font-size:22px;color:var(--forest);
    border-right:1px solid var(--parchment-line);padding-right:16px;
  }
  .month-row-year{font-size:13px;font-weight:400;color:var(--ink-soft);margin-left:6px;font-family:'JetBrains Mono',monospace;}
  .month-row-strip{
    flex:1;position:relative;
    display:grid;grid-template-columns:repeat(31,1fr);
    row-gap:4px;align-content:center;
    background-image:repeating-linear-gradient(
      to right,
      var(--parchment-line) 0, var(--parchment-line) 1px,
      transparent 1px, transparent calc(100%/31)
    );
  }
  .month-row-overflow{background:repeating-linear-gradient(-45deg, var(--parchment), var(--parchment) 6px, var(--parchment-line) 6px, var(--parchment-line) 12px);border-radius:3px;}
  .month-row-today{background:rgba(227,178,60,0.25);border-left:3px solid var(--gold);border-right:3px solid var(--gold);}
  .month-row-bar{
    font-size:13px;font-weight:700;color:var(--white);
    border-radius:4px;padding:0 6px;overflow:hidden;white-space:nowrap;
    line-height:30px;
  }
  .pill{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600;color:var(--white);}
  .year-rows-header{border-bottom:2px solid var(--forest);padding-bottom:8px;margin-bottom:4px;}
  .year-day-num{font-size:13px;color:var(--ink-soft);text-align:center;font-family:'JetBrains Mono',monospace;font-weight:600;}



  /* ---------- Task board ---------- */
  .task-board{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:28px;}
  .task-col{background:var(--white);border:1px solid var(--parchment-line);border-radius:4px;padding:14px;min-height:80px;}
  .task-col-head{
    display:flex;align-items:center;justify-content:space-between;
    font-family:'Fraunces',serif;font-weight:600;font-size:15px;
    margin-bottom:12px;padding-bottom:10px;border-bottom:2px solid var(--parchment-line);
  }
  .task-count{
    font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:600;
    background:var(--parchment);color:var(--ink-soft);
    border-radius:20px;padding:2px 8px;
  }
  .task-col.overdue .task-col-head{color:var(--clay);border-bottom-color:var(--clay);}
  .task-col.duenow .task-col-head{color:#9A7A16;border-bottom-color:var(--gold);}
  .task-col.upcoming .task-col-head{color:var(--forest);border-bottom-color:var(--sage);}
  .task-card{
    background:var(--parchment);
    border-left:4px solid var(--sage);
    border-radius:3px;
    padding:9px 11px 9px 30px;
    margin-bottom:8px;
    font-size:13px;
    cursor:pointer;
    position:relative;
    transition:opacity .15s ease;
  }
  .task-card:hover{outline:2px solid var(--gold);outline-offset:-2px;}
  .task-card .t-check{
    position:absolute;left:9px;top:9px;
    width:14px;height:14px;border-radius:3px;
    border:1.5px solid var(--sage);
    display:flex;align-items:center;justify-content:center;
    font-size:11px;font-weight:700;color:var(--white);
    background:transparent;
  }
  .task-card.done{opacity:.55;}
  .task-card.done .t-check{background:var(--sage);border-color:var(--sage);}
  .task-card.done .t-plant, .task-card.done .t-type, .task-card.done .t-range{text-decoration:line-through;}
  .task-card .t-plant{font-weight:700;color:var(--ink);}
  .task-card .t-type{font-size:11.5px;color:var(--ink-soft);margin:2px 0;}
  .task-card .t-range{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--ink-soft);}
  .task-col.overdue .task-card{border-left-color:var(--clay);}
  .task-col.duenow .task-card{border-left-color:var(--gold);}
  @media (max-width: 820px){ .task-board{grid-template-columns:1fr;} }

  /* ---------- Harvest tab ---------- */
  .harvest-form{display:grid;grid-template-columns:2fr 1fr 1fr 2fr auto;gap:12px;align-items:end;margin-bottom:24px;}
  table.harvest-table{width:100%;border-collapse:collapse;font-size:13.5px;}
  table.harvest-table th{text-align:left;padding:8px 10px;border-bottom:2px solid var(--forest);font-size:11px;text-transform:uppercase;color:var(--ink-soft);}
  table.harvest-table td{padding:9px 10px;border-bottom:1px solid var(--parchment-line);}
  .del-btn{background:none;border:none;color:var(--clay);cursor:pointer;font-size:12px;font-weight:700;}
  .totals-strip{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px;}
  .total-chip{background:var(--forest);color:var(--white);padding:8px 14px;border-radius:3px;font-size:12.5px;font-family:'JetBrains Mono',monospace;}
  .total-chip b{color:var(--gold);}

  .empty{color:var(--ink-soft);font-style:italic;font-size:13.5px;padding:20px 0;}

  /* ---------- My Garden dashboard ---------- */
  .stat-strip{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:20px;}
  .stat-card{flex:1;min-width:150px;background:var(--forest);color:var(--white);border-radius:4px;padding:16px 18px;}
  .stat-card.accent{background:var(--clay);}
  .stat-card .stat-value{font-family:'Fraunces',serif;font-size:28px;font-weight:700;line-height:1;}
  .stat-card .stat-label{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--sage-light);margin-top:6px;}
  .stat-card.accent .stat-label{color:#F3D9C8;}

  .task-snapshot{
    display:flex;gap:18px;align-items:center;flex-wrap:wrap;
    background:var(--white);border:1px solid var(--parchment-line);border-left:5px solid var(--gold);
    border-radius:3px;padding:14px 18px;margin-bottom:20px;
  }

  .bed-summary-grid{display:grid;grid-template-columns:repeat(auto-fill, minmax(260px,1fr));gap:14px;}
  .bed-summary-card{
    background:var(--white);border:1px solid var(--parchment-line);border-left:5px solid var(--forest);
    border-radius:3px;padding:14px;cursor:pointer;transition:border-color .15s ease;
  }
  .bed-summary-card:hover{border-left-color:var(--gold);}
  .bed-summary-card h4{margin:0 0 4px 0;font-family:'Fraunces',serif;font-size:16px;color:var(--forest);}
  .bed-summary-meta{font-size:11.5px;color:var(--ink-soft);font-family:'JetBrains Mono',monospace;margin-bottom:8px;}
  .bed-fill-bar{height:6px;border-radius:3px;background:var(--parchment-line);overflow:hidden;margin-bottom:10px;}
  .bed-fill-bar-inner{height:100%;background:var(--sage);}
  .bed-plant-chips{display:flex;flex-wrap:wrap;gap:5px;}
  .mini-chip{display:flex;align-items:center;gap:4px;font-size:11px;background:var(--parchment);padding:2px 7px;border-radius:20px;}
  .mini-swatch{width:8px;height:8px;border-radius:2px;flex-shrink:0;}
  .toast{
    position:fixed;bottom:20px;right:20px;
    background:var(--forest);color:var(--white);
    padding:10px 16px;border-radius:4px;font-size:13px;
    box-shadow:0 4px 14px rgba(0,0,0,.2);
    z-index:50;
  }
  ::-webkit-scrollbar{height:10px;width:10px;}
  ::-webkit-scrollbar-thumb{background:var(--sage-light);border-radius:6px;}
</style>
</head>
<body>
<div id="root"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>

<script type="text/babel">
const { useState, useEffect, useMemo, useCallback, useRef } = React;

/* ---------------- Default plant database (seed data, user-editable after load) ---------------- */
const DEFAULT_LIBRARY = [
  { id:'tomato', name:'Tomato', variety:'Better Boy', color:'#C1442D', sun:'Full sun', water:'Regular', spacing:'24 in', maturity:75, startIndoors:6, sowAfterFrost:1, tender:true },

  { id:'zucchini', name:'Zucchini', variety:'Black Beauty', color:'#5B9A3B', sun:'Full sun', water:'Regular', spacing:'36 in', maturity:50, startIndoors:3, sowAfterFrost:2, tender:true },
  { id:'onion', name:'Onion', variety:'Yellow Sweet Spanish', color:'#9B6BB0', sun:'Full sun', water:'Light', spacing:'4 in', maturity:100, startIndoors:8, sowAfterFrost:-3, tender:false },

  { id:'kale', name:'Kale', variety:'Lacinato (Dinosaur)', color:'#3E7248', sun:'Full sun', water:'Regular', spacing:'12 in', maturity:55, startIndoors:5, sowAfterFrost:-3, tender:false },
  { id:'radish', name:'Radish', variety:'Cherry Belle', color:'#B84A5E', sun:'Full sun', water:'Regular', spacing:'2 in', maturity:25, startIndoors:0, sowAfterFrost:-4, tender:false },
  { id:'beans', name:'Bush Beans', variety:'Provider', color:'#6E8F3E', sun:'Full sun', water:'Regular', spacing:'6 in', maturity:55, startIndoors:0, sowAfterFrost:2, tender:true },
  { id:'peas', name:'Peas', variety:'Sugar Snap', color:'#8CAE58', sun:'Full sun', water:'Regular', spacing:'3 in', maturity:60, startIndoors:0, sowAfterFrost:-4, tender:false },
  { id:'spinach', name:'Spinach', variety:'Bloomsdale Long Standing', color:'#2F6B3A', sun:'Part shade', water:'Frequent', spacing:'6 in', maturity:40, startIndoors:4, sowAfterFrost:-4, tender:false },

  beds:'furrow:beds',
  harvest:'furrow:harvest',
  frost:'furrow:frostdates',
  library:'furrow:library',

function hasClaudeStorage(){
  return typeof window !== 'undefined' && window.storage && typeof window.storage.get === 'function';
}

async function loadKey(key, fallback){
  if(hasClaudeStorage()){
    try{
      const res = await window.storage.get(key, false);
      return res ? JSON.parse(res.value) : fallback;
    }catch(e){ /* key not set yet, or window.storage unavailable here — fall through */ }
  }
  try{
    const raw = window.localStorage.getItem(key);
    return raw !== null ? JSON.parse(raw) : fallback;
  }catch(e){ return fallback; }
}

async function saveKey(key, value){
  let savedViaClaudeStorage = false;
  if(hasClaudeStorage()){
    try{
      const result = await window.storage.set(key, JSON.stringify(value), false);
      savedViaClaudeStorage = !!result;
    }catch(e){ /* fall through to localStorage */ }
  }
  if(!savedViaClaudeStorage){
    try{ window.localStorage.setItem(key, JSON.stringify(value)); }
    catch(e){ console.error('save failed', key, e); }
  }
}

function uid(){ return Math.random().toString(36).slice(2,10); }

function addDays(dateStr, days){
  const d = new Date(dateStr + 'T00:00:00');
  d.setDate(d.getDate() + days);
  return d;
}
function fmt(d){
  if(!d) return '—';
  return d.toLocaleDateString(undefined,{month:'short',day:'numeric'});
}
function shiftDate(d, days){
  const nd = new Date(d);
  nd.setDate(nd.getDate() + days);
  return nd;
}
function fmtRange(range, span=2){
  if(!range) return '—';
  const [start, end] = range;
  return `${fmt(start)} – ${fmt(end)}`;
}
function sameDay(a, b){
  return a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate();
}
function todayMidnight(){
  const t = new Date();
  t.setHours(0,0,0,0);
  return t;
}

// Each grid square = 12 inches. A plant needing more spacing occupies an N x N block.
function footprintSize(plant){
  if(!plant) return 1;
  const inches = parseInt(plant.spacing, 10);
  if(!inches || inches <= 12) return 1;
  return Math.ceil(inches / 12);
}
// If a plant's spacing is tight enough that several fit inside one 12in square,
// this is how many (per side, squared) will fit in that single square.
function plantsPerSquare(plant){
  if(!plant) return 1;
  const inches = parseInt(plant.spacing, 10);
  if(!inches || inches >= 12) return 1;
  const perSide = Math.max(1, Math.floor(12 / inches));
  return perSide * perSide;
}
// Offsets (relative to the anchor square) that make up a centered N x N footprint.
function footprintOffsets(n){
  const start = -Math.floor((n - 1) / 2);
  return Array.from({length:n}, (_, i) => start + i);
}

const PALETTE_COLORS = ['#C1442D','#D9822B','#7FA654','#E08A2C','#4C7A3D','#3F8552','#5B9A3B','#9B6BB0','#3E7248','#B84A5E','#6E8F3E','#8C2F4A','#33684A','#A8324A','#8C6B4F'];
function randomColor(){ return PALETTE_COLORS[Math.floor(Math.random()*PALETTE_COLORS.length)]; }

// Normalizes a bed's cells to the { plantId, groupId } shape, upgrading the
// old format (plain plantId string) used before multi-square footprints.
function normalizeBeds(bedsArr){
  if(!Array.isArray(bedsArr)) return [];
  return bedsArr.map(bed => {
    const cells = {};
    Object.entries(bed.cells || {}).forEach(([key, val]) => {
      cells[key] = typeof val === 'string' ? { plantId: val, groupId: uid() } : val;
    });
    return { ...bed, cells };
  });
}

function App(){
  const [tab, setTab] = useState('garden');
  const [beds, setBeds] = useState([]);
  const [activeBedId, setActiveBedId] = useState(null);
  const [harvest, setHarvest] = useState([]);
  const [frost, setFrost] = useState({ lastSpring:'', firstFall:'' });
  const [library, setLibrary] = useState(DEFAULT_LIBRARY);
  const [myGarden, setMyGarden] = useState([]);
  const [completedTasks, setCompletedTasks] = useState([]);
  const [plannerName, setPlannerName] = useState('Furrow');
  const [editingName, setEditingName] = useState(false);
  const [loaded, setLoaded] = useState(false);
  const [saving, setSaving] = useState('idle');
  const [toast, setToast] = useState('');

  const showToast = (msg) => {
    setToast(msg);
    setTimeout(() => setToast(''), 2200);
  };

  // load
  useEffect(() => {
    (async () => {
      const [b, h, f, lib, nm, mg, ct] = await Promise.all([
        loadKey(STORAGE_KEYS.beds, []),
        loadKey(STORAGE_KEYS.harvest, []),
        loadKey(STORAGE_KEYS.frost, { lastSpring:'', firstFall:'' }),
        loadKey(STORAGE_KEYS.library, DEFAULT_LIBRARY),
        loadKey(STORAGE_KEYS.name, 'Furrow'),
        loadKey(STORAGE_KEYS.myGarden, null),
        loadKey(STORAGE_KEYS.completedTasks, []),
      ]);
      // migrate old-format cells (plain plantId string) to { plantId, groupId }
      const migratedBeds = normalizeBeds(b);
      setBeds(migratedBeds);
      setHarvest(h);
      setFrost(f);
      setLibrary(lib);
      setPlannerName(nm);
      // first time ever: start My Garden with everything already in the library
      setMyGarden(mg === null ? lib.map(p => p.id) : mg);
      setCompletedTasks(ct);
      if(migratedBeds.length) setActiveBedId(migratedBeds[0].id);
      setLoaded(true);
    })();
  }, []);

  // persist on change (skip initial)
  useEffect(() => { if(loaded){ setSaving('saving'); saveKey(STORAGE_KEYS.beds, beds).then(()=>setSaving('saved')); } }, [beds, loaded]);
  useEffect(() => { if(loaded){ setSaving('saving'); saveKey(STORAGE_KEYS.harvest, harvest).then(()=>setSaving('saved')); } }, [harvest, loaded]);
  useEffect(() => { if(loaded){ setSaving('saving'); saveKey(STORAGE_KEYS.frost, frost).then(()=>setSaving('saved')); } }, [frost, loaded]);
  useEffect(() => { if(loaded){ setSaving('saving'); saveKey(STORAGE_KEYS.library, library).then(()=>setSaving('saved')); } }, [library, loaded]);
  useEffect(() => { if(loaded){ setSaving('saving'); saveKey(STORAGE_KEYS.name, plannerName).then(()=>setSaving('saved')); } }, [plannerName, loaded]);
  useEffect(() => { if(loaded){ setSaving('saving'); saveKey(STORAGE_KEYS.myGarden, myGarden).then(()=>setSaving('saved')); } }, [myGarden, loaded]);
  useEffect(() => { if(loaded){ setSaving('saving'); saveKey(STORAGE_KEYS.completedTasks, completedTasks).then(()=>setSaving('saved')); } }, [completedTasks, loaded]);

  const activeBed = beds.find(b => b.id === activeBedId) || null;
  const gardenPlantList = useMemo(() => library.filter(p => myGarden.includes(p.id)), [library, myGarden]);

  const importInputRef = useRef(null);

  const exportData = () => {
    const payload = {
      furrowBackup: true,
      version: 1,
      exportedAt: new Date().toISOString(),
      plannerName,
      beds,
      harvest,
      frost,
      library,
      myGarden,
      completedTasks,
    };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type:'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const safeName = (plannerName || 'furrow').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-+|-+$)/g,'') || 'furrow';
    a.href = url;
    a.download = `${safeName}-backup-${new Date().toISOString().slice(0,10)}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showToast('Backup downloaded');
  };

  const triggerImport = () => { if(importInputRef.current) importInputRef.current.click(); };

  const handleImportFile = (e) => {
    const file = e.target.files && e.target.files[0];
    e.target.value = ''; // allow re-selecting the same file later
    if(!file) return;
    const reader = new FileReader();
    reader.onload = (evt) => {
      let data;
      try{ data = JSON.parse(evt.target.result); }
      catch(err){ showToast("That file isn't valid JSON"); return; }

      if(!data || typeof data !== 'object' || (!data.furrowBackup && !Array.isArray(data.beds))){
        showToast("Doesn't look like a Furrow backup file");
        return;
      }
      const ok = window.confirm('Importing will replace everything currently in this planner — beds, plant library, My Garden, harvest log, and tasks. Continue?');
      if(!ok) return;

      if(Array.isArray(data.beds)){
        const migrated = normalizeBeds(data.beds);
        setBeds(migrated);
        setActiveBedId(migrated.length ? migrated[0].id : null);
      }
      if(Array.isArray(data.harvest)) setHarvest(data.harvest);
      if(data.frost && typeof data.frost === 'object') setFrost({ lastSpring: data.frost.lastSpring || '', firstFall: data.frost.firstFall || '' });
      if(Array.isArray(data.library)) setLibrary(data.library);
      if(typeof data.plannerName === 'string' && data.plannerName.trim()) setPlannerName(data.plannerName);
      if(Array.isArray(data.myGarden)) setMyGarden(data.myGarden);
      if(Array.isArray(data.completedTasks)) setCompletedTasks(data.completedTasks);
      showToast('Backup imported');
    };
    reader.onerror = () => showToast('Could not read that file');
    reader.readAsText(file);
  };

  const createBed = (name, rows, cols) => {
    const newBed = { id: uid(), name, rows, cols, cells: {} };
    setBeds(prev => [...prev, newBed]);
    setActiveBedId(newBed.id);
  };
  const deleteBed = (id) => {
    setBeds(prev => prev.filter(b => b.id !== id));
    if(activeBedId === id){
      const remaining = beds.filter(b => b.id !== id);
      setActiveBedId(remaining.length ? remaining[0].id : null);
    }
  };
  // Places a plant anchored at (r,c), blocking out an N x N footprint if its
  // spacing needs more than one 12in square. Clicking an occupied square with
  // the same plant selected clears the whole placement; clearing removes the
  // whole group a square belongs to, not just that one square.
  const placePlant = (bedId, r, c, plantId) => {
    setBeds(prev => prev.map(b => {
      if(b.id !== bedId) return b;
      const cells = { ...b.cells };
      const key = `${r}-${c}`;
      const existing = cells[key];

      const clearGroup = (groupId) => {
        Object.keys(cells).forEach(k => { if(cells[k] && cells[k].groupId === groupId) delete cells[k]; });
      };

      if(!plantId){
        if(existing) clearGroup(existing.groupId);
        return { ...b, cells };
      }
      if(existing && existing.plantId === plantId){
        clearGroup(existing.groupId);
        return { ...b, cells };
      }

      const plant = library.find(p => p.id === plantId);
      const n = footprintSize(plant);
      const offsets = footprintOffsets(n);
      const targetKeys = [];
      offsets.forEach(dr => offsets.forEach(dc => {
        const rr = r + dr, cc = c + dc;
        if(rr >= 0 && rr < b.rows && cc >= 0 && cc < b.cols) targetKeys.push(`${rr}-${cc}`);
      }));

      // clear any existing groups this footprint would overlap
      const groupsToClear = new Set();
      targetKeys.forEach(k => { if(cells[k]) groupsToClear.add(cells[k].groupId); });
      groupsToClear.forEach(clearGroup);

      const groupId = uid();
      targetKeys.forEach(k => { cells[k] = { plantId, groupId }; });
      return { ...b, cells };
    }));
  };

  // Moves every square belonging to a group by (deltaR, deltaC), used when
  // dragging a placed plant to a new spot in the same bed. No-ops if the move
  // would go out of bounds or land on a different group's squares.
  const moveGroup = (bedId, groupId, deltaR, deltaC) => {
    if(!deltaR && !deltaC) return;
    setBeds(prev => prev.map(b => {
      if(b.id !== bedId) return b;
      const cells = { ...b.cells };
      const groupEntries = Object.entries(cells).filter(([k, v]) => v && v.groupId === groupId);
      if(groupEntries.length === 0) return b;
      const plantId = groupEntries[0][1].plantId;

      const newPositions = groupEntries.map(([k]) => {
        const [r, c] = k.split('-').map(Number);
        return { r: r + deltaR, c: c + deltaC };
      });

      const inBounds = newPositions.every(p => p.r >= 0 && p.r < b.rows && p.c >= 0 && p.c < b.cols);
      if(!inBounds) return b;

      const collides = newPositions.some(p => {
        const existing = cells[`${p.r}-${p.c}`];
        return existing && existing.groupId !== groupId;
      });
      if(collides) return b;

      groupEntries.forEach(([k]) => delete cells[k]);
      newPositions.forEach(p => { cells[`${p.r}-${p.c}`] = { plantId, groupId }; });
      return { ...b, cells };
    }));
  };

  // My Garden roster: which library plants are actively part of this season's garden.
  // Only these plants show up in the bed palette and generate tasks.
  const addToGarden = (plantId) => {
    setMyGarden(prev => prev.includes(plantId) ? prev : [...prev, plantId]);
    showToast('Added to My Garden');
  };
  const removeFromGarden = (plantId) => {
    setMyGarden(prev => prev.filter(id => id !== plantId));
    showToast('Removed from My Garden');
  };

  const toggleTaskComplete = (taskId) => {
    setCompletedTasks(prev => prev.includes(taskId) ? prev.filter(id => id !== taskId) : [...prev, taskId]);
  };

  // library CRUD
  const addLibraryPlant = (plant) => {
    const id = uid();
    setLibrary(prev => [...prev, { ...plant, id }]);
    setMyGarden(prev => [...prev, id]); // newly created plants join My Garden automatically
  };
  const updateLibraryPlant = (id, patch) => setLibrary(prev => prev.map(p => p.id === id ? { ...p, ...patch } : p));
  const removeLibraryPlant = (id) => {
    setLibrary(prev => prev.filter(p => p.id !== id));
    setMyGarden(prev => prev.filter(pid => pid !== id));
  };

  return (
    <div className="app">
      <div className="topbar">
        <div className="brand">
          {editingName ? (
            <input
              className="brand-input"
              autoFocus
              value={plannerName}
              onChange={e=>setPlannerName(e.target.value)}
              onBlur={()=>setEditingName(false)}
              onKeyDown={e=>{ if(e.key==='Enter') setEditingName(false); }}
            />
          ) : (
            <div className="brand-mark" title="Click to rename" onClick={()=>setEditingName(true)}>
              {plannerName}<span>.</span>
            </div>
          )}
          <div className="tagline">plan the rows before you dig them</div>
        </div>
        <div className="topbar-actions">
          <button className="header-btn" onClick={exportData}>Export backup</button>
          <button className="header-btn" onClick={triggerImport}>Import backup</button>
          <input
            ref={importInputRef}
            type="file"
            accept="application/json,.json"
            style={{display:'none'}}
            onChange={handleImportFile}
          />
          <div className="save-status">{saving === 'saving' ? 'saving…' : loaded ? 'saved' : 'loading…'}</div>
        </div>
      </div>

      <div className="nav">
        {[
          ['garden','My Garden'],
          ['beds','Garden Beds'],
          ['library','Plant Library'],
          ['calendar','Planting Calendar'],
          ['tasks','Tasks'],
          ['harvest','Harvest Log'],
        ].map(([key,label]) => (
          <button key={key} className={tab===key ? 'active':''} onClick={()=>setTab(key)}>{label}</button>
        ))}
      </div>

      <main>
        {!loaded && <div className="empty">Loading your garden…</div>}
        {loaded && tab === 'garden' && (
          <GardenTab
            plannerName={plannerName}
            beds={beds}
            library={library}
            gardenPlantList={gardenPlantList}
            harvest={harvest}
            frost={frost}
            completedTasks={completedTasks}
            removeFromGarden={removeFromGarden}
            setTab={setTab}
          />
        )}
        {loaded && tab === 'beds' && (
          <BedsTab
            beds={beds}
            library={library}
            gardenPlants={gardenPlantList}
            activeBed={activeBed}
            setActiveBedId={setActiveBedId}
            createBed={createBed}
            deleteBed={deleteBed}
            placePlant={placePlant}
            moveGroup={moveGroup}
            setTab={setTab}
          />
        )}
        {loaded && tab === 'library' && (
          <LibraryTab
            library={library}
            myGarden={myGarden}
            addLibraryPlant={addLibraryPlant}
            updateLibraryPlant={updateLibraryPlant}
            removeLibraryPlant={removeLibraryPlant}
            addToGarden={addToGarden}
            removeFromGarden={removeFromGarden}
          />
        )}
        {loaded && tab === 'calendar' && (
          <CalendarTab
            frost={frost}
            setFrost={setFrost}
            library={gardenPlantList}
            setTab={setTab}
            completedTasks={completedTasks}
          />
        )}
        {loaded && tab === 'tasks' && (
          <TasksTab
            frost={frost}
            library={gardenPlantList}
            completedTasks={completedTasks}
            toggleTaskComplete={toggleTaskComplete}
            setTab={setTab}
          />
        )}
        {loaded && tab === 'harvest' && <HarvestTab harvest={harvest} setHarvest={setHarvest} library={library} />}
      </main>

      {toast && <div className="toast">{toast}</div>}
    </div>
  );
}

/* ---------------- Beds Tab ---------------- */
function BedsTab({ beds, library, gardenPlants, activeBed, setActiveBedId, createBed, deleteBed, placePlant, moveGroup, setTab }){
  const [selectedPlant, setSelectedPlant] = useState(gardenPlants[0] ? gardenPlants[0].id : null);
  const [showNewBed, setShowNewBed] = useState(beds.length === 0);
  const [name, setName] = useState('');
  const [rows, setRows] = useState('6');
  const [cols, setCols] = useState('8');
  const [formError, setFormError] = useState('');
  const [dragOrigin, setDragOrigin] = useState(null);
  const [dragOverKey, setDragOverKey] = useState(null);

  const plantById = useMemo(() => Object.fromEntries(library.map(p=>[p.id,p])), [library]);

  // For each placed group, find its bounds so we can pick one "center" cell to
  // carry the letter while every cell in the group renders as a solid block.
  const groupInfo = useMemo(() => {
    if(!activeBed) return {};
    const info = {};
    Object.entries(activeBed.cells).forEach(([key, cellData]) => {
      if(!cellData) return;
      const [r, c] = key.split('-').map(Number);
      const gid = cellData.groupId;
      if(!info[gid]) info[gid] = { minR:r, maxR:r, minC:c, maxC:c, count:0, plantId: cellData.plantId };
      const g = info[gid];
      g.minR = Math.min(g.minR, r); g.maxR = Math.max(g.maxR, r);
      g.minC = Math.min(g.minC, c); g.maxC = Math.max(g.maxC, c);
      g.count++;
    });
    Object.values(info).forEach(g => {
      g.centerKey = `${Math.round((g.minR+g.maxR)/2)}-${Math.round((g.minC+g.maxC)/2)}`;
    });
    return info;
  }, [activeBed]);

  useEffect(() => {
    if(!gardenPlants.find(p => p.id === selectedPlant)){
      setSelectedPlant(gardenPlants[0] ? gardenPlants[0].id : null);
    }
  }, [gardenPlants]);

  const submitNewBed = (e) => {
    e.preventDefault();
    e.stopPropagation();
    const trimmedName = name.trim();
    if(!trimmedName){
      setFormError('Give the bed a name first.');
      return;
    }
    const parsedRows = Math.max(1, Math.min(20, parseInt(rows, 10) || 6));
    const parsedCols = Math.max(1, Math.min(20, parseInt(cols, 10) || 8));
    createBed(trimmedName, parsedRows, parsedCols);
    setName(''); setRows('6'); setCols('8'); setFormError(''); setShowNewBed(false);
  };

  const filledCount = activeBed ? Object.keys(activeBed.cells).length : 0;
  const totalCells = activeBed ? activeBed.rows * activeBed.cols : 0;

  return (
    <div>
      <h2 className="section-title">Garden Beds</h2>
      <p className="section-sub">Lay out each bed on a grid, then click a plant below and paint it into the squares.</p>

      <div className="bed-list">
        {beds.map(b => (
          <div key={b.id} className={`bed-chip ${activeBed && activeBed.id===b.id ? 'active':''}`} onClick={()=>setActiveBedId(b.id)}>
            {b.name} <span style={{opacity:.6}}>({b.rows}×{b.cols})</span>
          </div>
        ))}
        <div className="bed-chip" style={{borderStyle:'dashed'}} onClick={()=>setShowNewBed(s=>!s)}>+ New bed</div>
      </div>

      {showNewBed && (
        <form className="panel" style={{marginBottom:24}} onSubmit={submitNewBed} noValidate>
          <div className="row">
            <div className="col field">
              <label>Bed name</label>
              <input
                value={name}
                onChange={e=>{ setName(e.target.value); if(formError) setFormError(''); }}
                placeholder="e.g. North raised bed"
              />
            </div>
            <div className="col field">
              <label>Rows</label>
              <input type="number" min="1" max="20" value={rows} onChange={e=>setRows(e.target.value)} />
            </div>
            <div className="col field">
              <label>Columns</label>
              <input type="number" min="1" max="20" value={cols} onChange={e=>setCols(e.target.value)} />
            </div>
          </div>
          {formError && <div style={{color:'var(--clay)', fontSize:13, fontWeight:600, marginBottom:10}}>{formError}</div>}
          <button className="btn" type="submit">Create bed</button>
        </form>
      )}

      {activeBed ? (
        <React.Fragment>
          {gardenPlants.length === 0 ? (
            <div className="empty">
              Nothing in your My Garden roster yet — head to the{' '}
              <span style={{textDecoration:'underline', cursor:'pointer', color:'var(--forest)', fontWeight:600}} onClick={()=>setTab('library')}>
                Plant Library
              </span>{' '}
              and add plants to My Garden before placing them here.
            </div>
          ) : (
            <React.Fragment>
              <div className="plant-palette">
                {gardenPlants.map(p => {
                  const n = footprintSize(p);
                  const per = plantsPerSquare(p);
                  const badge = n > 1 ? ` (${n}×${n} sq)` : (per > 1 ? ` (×${per}/sq)` : '');
                  return (
                    <div key={p.id} className={`plant-tag ${selectedPlant===p.id ? 'selected':''}`} onClick={()=>setSelectedPlant(p.id)} title={p.variety || ''}>
                      <span className="swatch" style={{background:p.color}}></span>
                      {p.name}{badge}
                    </div>
                  );
                })}
                <div className="plant-tag" onClick={()=>setSelectedPlant(null)} style={{opacity:.7}}>
                  ✕ Clear cell
                </div>
              </div>
              <p style={{fontSize:12, color:'var(--ink-soft)', margin:'-10px 0 16px 0'}}>
                Each square is 12 in. Wide-spaced plants block out a solid multi-square footprint; tight-spaced plants show how many fit per square.
              </p>
            </React.Fragment>
          )}

          <div className="grid-wrap">
            <table className="bed-grid">
              <tbody>
                {Array.from({length: activeBed.rows}).map((_, r) => (
                  <tr key={r}>
                    {Array.from({length: activeBed.cols}).map((_, c) => {
                      const key = `${r}-${c}`;
                      const cellData = activeBed.cells[key];
                      const plant = cellData ? plantById[cellData.plantId] : null;
                      const group = cellData ? groupInfo[cellData.groupId] : null;
                      const isMerged = group && group.count > 1;
                      const showLetter = plant && (!isMerged || key === group.centerKey);
                      const per = plant ? plantsPerSquare(plant) : 1;
                      const isDraggingThisGroup = dragOrigin && cellData && dragOrigin.groupId === cellData.groupId;
                      const isDropTarget = dragOverKey === key && dragOrigin && !isDraggingThisGroup;
                      return (
                        <td
                          key={c}
                          className={`${isDraggingThisGroup ? 'dragging' : ''} ${isDropTarget ? 'drag-over' : ''}`}
                          draggable={!!cellData}
                          onClick={()=>placePlant(activeBed.id, r, c, selectedPlant)}
                          onDragStart={(e)=>{
                            if(!cellData) return;
                            setDragOrigin({ r, c, groupId: cellData.groupId });
                            e.dataTransfer.effectAllowed = 'move';
                            try{ e.dataTransfer.setData('text/plain', cellData.groupId); }catch(err){}
                          }}
                          onDragOver={(e)=>{ if(dragOrigin){ e.preventDefault(); setDragOverKey(key); } }}
                          onDragLeave={()=>{ setDragOverKey(k => k===key ? null : k); }}
                          onDrop={(e)=>{
                            e.preventDefault();
                            if(dragOrigin) moveGroup(activeBed.id, dragOrigin.groupId, r-dragOrigin.r, c-dragOrigin.c);
                            setDragOrigin(null);
                            setDragOverKey(null);
                          }}
                          onDragEnd={()=>{ setDragOrigin(null); setDragOverKey(null); }}
                        >
                          <div className={`cell-fill ${isMerged ? 'merged' : ''}`} style={{background: plant ? plant.color : 'transparent'}}>
                            {showLetter && (
                              <React.Fragment>
                                <span>{plant.name[0]}</span>
                                {!isMerged && per > 1 && <span className="sq-count">×{per}</span>}
                              </React.Fragment>
                            )}
                          </div>
                        </td>
                      );
                    })}
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
          <p style={{fontSize:12, color:'var(--ink-soft)', margin:'10px 0 0 0'}}>
            Drag a planted square to move it — the whole footprint moves together.
          </p>

          <div className="bed-meta">
            <span>{filledCount} / {totalCells} squares planted</span>
            <span>{activeBed.rows} rows × {activeBed.cols} cols</span>
            <button className="del-btn" style={{marginLeft:'auto'}} onClick={()=>deleteBed(activeBed.id)}>delete this bed</button>
          </div>
        </React.Fragment>
      ) : (
        !showNewBed && <div className="empty">No beds yet — create one to start planning.</div>
      )}
    </div>
  );
}

/* ---------------- Frost date estimation from ZIP ---------------- */
async function estimateFrostDatesFromZip(zip){
  // 1. Geocode the ZIP (US only) to lat/lon
  const geoRes = await fetch(`https://api.zippopotam.us/us/${encodeURIComponent(zip)}`);
  if(!geoRes.ok) throw new Error('ZIP code not found');
  const geo = await geoRes.json();
  const place = geo.places && geo.places[0];
  if(!place) throw new Error('ZIP code not found');
  const lat = parseFloat(place.latitude);
  const lon = parseFloat(place.longitude);
  const placeName = `${place['place name']}, ${place['state abbreviation']}`;

  // 2. Pull historical daily min temps (last ~10 full years) and find frost crossings
  const endYear = new Date().getFullYear() - 1;
  const startYear = endYear - 9;
  const weatherRes = await fetch(
    `https://archive-api.open-meteo.com/v1/archive?latitude=${lat}&longitude=${lon}` +
    `&start_date=${startYear}-01-01&end_date=${endYear}-12-31` +
    `&daily=temperature_2m_min&temperature_unit=fahrenheit&timezone=auto`
  );
  if(!weatherRes.ok) throw new Error('Could not fetch historical weather for this location');
  const weather = await weatherRes.json();
  const dates = weather.daily.time;
  const mins = weather.daily.temperature_2m_min;

  const springDOYs = [];
  const fallDOYs = [];
  let currentYear = null, lastFrostThisYear = null, firstFallFrostThisYear = null;

  const flushYear = () => {
    if(lastFrostThisYear != null) springDOYs.push(lastFrostThisYear);
    if(firstFallFrostThisYear != null) fallDOYs.push(firstFallFrostThisYear);
  };

  for(let i = 0; i < dates.length; i++){
    const d = new Date(dates[i] + 'T00:00:00');
    const year = d.getFullYear();
    const doy = Math.floor((d - new Date(year,0,0)) / 86400000);
    const midYear = Math.floor((year % 4 === 0 ? 366 : 365) / 2);

    if(year !== currentYear){
      flushYear();
      currentYear = year; lastFrostThisYear = null; firstFallFrostThisYear = null;
    }
    if(mins[i] != null && mins[i] <= 32){
      if(doy <= midYear) lastFrostThisYear = doy;
      else if(firstFallFrostThisYear == null) firstFallFrostThisYear = doy;
    }
  }
  flushYear();

  if(springDOYs.length === 0 || fallDOYs.length === 0){
    throw new Error('Not enough historical frost data for this location');
  }
  const avg = (arr) => Math.round(arr.reduce((a,b)=>a+b,0) / arr.length);
  const avgSpringDOY = avg(springDOYs);
  const avgFallDOY = avg(fallDOYs);

  const refYear = new Date().getFullYear();
  const toISO = (doy) => {
    const d = new Date(refYear, 0, doy);
    return d.toISOString().slice(0,10);
  };

  return {
    lastSpring: toISO(avgSpringDOY),
    firstFall: toISO(avgFallDOY),
    placeName,
    yearsUsed: `${startYear}–${endYear}`,
  };
}

function ZipFrostLookup({ onResolved }){
  const [zip, setZip] = useState('');
  const [status, setStatus] = useState('idle'); // idle | loading | error | done
  const [message, setMessage] = useState('');

  const runLookup = async (e) => {
    e.preventDefault();
    if(!/^\d{5}$/.test(zip.trim())){
      setStatus('error');
      setMessage('Enter a 5-digit US ZIP code.');
      return;
    }
    setStatus('loading');
    setMessage('');
    try{
      const result = await estimateFrostDatesFromZip(zip.trim());
      onResolved(result);
      setStatus('done');
      setMessage(`Estimated from ${result.yearsUsed} of history near ${result.placeName}. Adjust the dates below if your garden runs earlier or later.`);
    }catch(err){
      setStatus('error');
      setMessage(err.message || 'Could not look up that ZIP code.');
    }
  };

  return (
    <form className="panel" style={{marginBottom:20}} onSubmit={runLookup} noValidate>
      <div style={{display:'flex', gap:12, alignItems:'flex-end', flexWrap:'wrap'}}>
        <div className="field" style={{marginBottom:0, maxWidth:160}}>
          <label>US ZIP code</label>
          <input value={zip} onChange={e=>setZip(e.target.value)} placeholder="e.g. 14428" maxLength={5} />
        </div>
        <button className="btn clay" type="submit" disabled={status==='loading'}>
          {status==='loading' ? 'Looking up…' : 'Fill in frost dates'}
        </button>
      </div>
      {message && (
        <div style={{marginTop:10, fontSize:12.5, color: status==='error' ? 'var(--clay)' : 'var(--ink-soft)'}}>
          {message}
        </div>
      )}
    </form>
  );
}

/* ---------------- Calendar Tab ---------------- */
const CALENDAR_RANGE_SPAN = 3; // +/- 3 days = 6 day span (end - start)

function computeCalendarRows(frost, library){
  const ready = frost.lastSpring && frost.firstFall;
  if(!ready) return [];
  return library.map(p => {
    const startIndoor = p.startIndoors > 0 ? addDays(frost.lastSpring, -7*p.startIndoors) : null;
    const sowOutdoor = p.sowAfterFrost <= -90 ? null : addDays(frost.lastSpring, 7*p.sowAfterFrost);
    const harvestBy = sowOutdoor ? addDays(sowOutdoor.toISOString().slice(0,10), p.maturity) : null;
    const fallLimit = new Date(frost.firstFall + 'T00:00:00');
    const cutsCloseToFrost = harvestBy && harvestBy > fallLimit;

    const startIndoorRange = startIndoor ? [shiftDate(startIndoor,-CALENDAR_RANGE_SPAN), shiftDate(startIndoor,CALENDAR_RANGE_SPAN)] : null;
    const sowOutdoorRange = sowOutdoor ? [shiftDate(sowOutdoor,-CALENDAR_RANGE_SPAN), shiftDate(sowOutdoor,CALENDAR_RANGE_SPAN)] : null;
    const harvestRange = harvestBy ? [shiftDate(harvestBy,-CALENDAR_RANGE_SPAN), shiftDate(harvestBy,CALENDAR_RANGE_SPAN)] : null;

    return { plant:p, startIndoor, sowOutdoor, harvestBy, startIndoorRange, sowOutdoorRange, harvestRange, risky: cutsCloseToFrost };
  }).sort((a,b) => {
    const da = a.sowOutdoor || a.startIndoor || new Date(8640000000000000);
    const db = b.sowOutdoor || b.startIndoor || new Date(8640000000000000);
    return da - db;
  });
}

function computeTaskBuckets(rows){
  const today = todayMidnight();
  const all = [];
  rows.forEach(r => {
    if(r.startIndoorRange) all.push({ id:`${r.plant.id}-start`, plant:r.plant, type:'Start indoors', range:r.startIndoorRange });
    if(r.sowOutdoorRange) all.push({ id:`${r.plant.id}-sow`, plant:r.plant, type:'Direct sow / transplant', range:r.sowOutdoorRange });
    if(r.harvestRange) all.push({ id:`${r.plant.id}-harvest`, plant:r.plant, type:'Harvest', range:r.harvestRange });
  });
  const buckets = { overdue:[], dueNow:[], upcoming:[] };
  all.forEach(t => {
    const [start, end] = t.range;
    if(end < today) buckets.overdue.push(t);
    else if(start <= today) buckets.dueNow.push(t);
    else buckets.upcoming.push(t);
  });
  buckets.overdue.sort((a,b)=>a.range[1]-b.range[1]);
  buckets.dueNow.sort((a,b)=>a.range[0]-b.range[0]);
  buckets.upcoming.sort((a,b)=>a.range[0]-b.range[0]);
  return buckets;
}

const TYPE_ABBR = { start:'S', sow:'P', harvest:'H' };
const TYPE_LABELS = { start:'Start indoors', sow:'Direct sow / transplant', harvest:'Harvest' };
const MONTH_NAMES = ['January','February','March','April','May','June','July','August','September','October','November','December'];

function flattenEvents(rows, completedTasks){
  const done = new Set(completedTasks || []);
  const events = [];
  rows.forEach(r => {
    const startId = `${r.plant.id}-start`, sowId = `${r.plant.id}-sow`, harvestId = `${r.plant.id}-harvest`;
    if(r.startIndoorRange && !done.has(startId)) events.push({ id:startId, plant:r.plant, type:'start', range:r.startIndoorRange });
    if(r.sowOutdoorRange && !done.has(sowId)) events.push({ id:sowId, plant:r.plant, type:'sow', range:r.sowOutdoorRange });
    if(r.harvestRange && !done.has(harvestId)) events.push({ id:harvestId, plant:r.plant, type:'harvest', range:r.harvestRange });
  });
  return events;
}

function daysInMonth(year, month){
  return new Date(year, month+1, 0).getDate();
}

// Clips events to a single month (by day-of-month, 1-31) and assigns each a
// display "track" (row) so overlapping bars stack instead of colliding.
function eventsForMonthRow(events, year, month){
  const monthStart = new Date(year, month, 1);
  const monthEnd = new Date(year, month, daysInMonth(year, month));
  const clipped = events
    .filter(e => e.range[1] >= monthStart && e.range[0] <= monthEnd)
    .map(e => {
      const clipStart = e.range[0] < monthStart ? monthStart : e.range[0];
      const clipEnd = e.range[1] > monthEnd ? monthEnd : e.range[1];
      return { ...e, startDay: clipStart.getDate(), endDay: clipEnd.getDate() };
    })
    .sort((a,b) => a.startDay - b.startDay || (a.range[0] - b.range[0]));

  const tracks = [];
  clipped.forEach(ev => {
    let track = tracks.find(t => t.endDay < ev.startDay);
    if(!track){ track = { endDay:-1 }; tracks.push(track); }
    ev.track = tracks.indexOf(track);
    track.endDay = ev.endDay;
  });
  return clipped;
}

// One horizontal line per month: label on the left, a 31-column day strip on
// the right. Every row shares the same 31 columns so a given day-of-month
// lines up vertically across the whole year.
function MonthRow({ year, month, events }){
  const total = daysInMonth(year, month);
  const rowEvents = useMemo(() => eventsForMonthRow(events, year, month), [events, year, month]);
  const trackCount = Math.max(1, rowEvents.reduce((max,e) => Math.max(max, e.track+1), 0));
  const today = todayMidnight();
  const isCurrentMonth = today.getFullYear()===year && today.getMonth()===month;

  return (
    <div className="month-row">
      <div className="month-row-label">
        {MONTH_NAMES[month].slice(0,3)} <span className="month-row-year">{year}</span>
      </div>
      <div className="month-row-strip" style={{gridTemplateRows:`repeat(${trackCount}, 30px)`}}>
        {total < 31 && (
          <div className="month-row-overflow" style={{gridColumn:`${total+1} / 32`, gridRow:`1 / ${trackCount+1}`}}></div>
        )}
        {isCurrentMonth && (
          <div className="month-row-today" style={{gridColumn: today.getDate(), gridRow:`1 / ${trackCount+1}`}}></div>
        )}
        {rowEvents.map(ev => (
          <div
            key={ev.id}
            className="month-row-bar"
            title={`${ev.plant.name}${ev.plant.variety ? ' — '+ev.plant.variety : ''}: ${TYPE_LABELS[ev.type]} (${fmtRange(ev.range)})`}
            style={{ gridColumn:`${ev.startDay} / ${ev.endDay+1}`, gridRow: ev.track+1, background: ev.plant.color }}
          >
            {(ev.endDay - ev.startDay) >= 2 ? `${TYPE_ABBR[ev.type]} ${ev.plant.name}` : TYPE_ABBR[ev.type]}
          </div>
        ))}
      </div>
    </div>
  );
}

                            <td>{r.harvestRange ? (harvestDone ? doneBadge : fmtRange(r.harvestRange)) : '—'}</td>
                            <td>
                              {r.risky
                                ? <span className="pill" style={{background:'var(--clay)'}}>cuts it close to fall frost</span>
                                : <span className="pill" style={{background:'var(--sage)'}}>comfortable window</span>}
                            </td>
                          </tr>
                        );
                      })}
                    </tbody>
                  </table>
                </div>
              ) : (
                <React.Fragment>
                  <div className="year-legend">
                    <div className="year-legend-group">
                      <span className="year-legend-badge">S</span> Start indoors
                      <span className="year-legend-badge">P</span> Direct sow / transplant
                      <span className="year-legend-badge">H</span> Harvest
                    </div>
                    <div className="year-legend-group">
                      {library.map(p => (
                        <span className="year-legend-plant" key={p.id}>
                          <span className="mini-swatch" style={{background:p.color}}></span>{p.name}
                        </span>
                      ))}
                    </div>
                    <div className="year-legend-group" style={{marginLeft:'auto'}}>
                      <label style={{fontWeight:600, color:'var(--ink-soft)'}}>Start month</label>
                      <select value={startMonth} onChange={e=>setStartMonth(parseInt(e.target.value,10))} style={{width:'auto', padding:'5px 8px'}}>
                        {MONTH_NAMES.map((name,i) => <option key={i} value={i}>{name}</option>)}
                      </select>
                    </div>
                  </div>
                  <div className="year-rows">
                    <div className="month-row year-rows-header">
                      <div className="month-row-label"></div>
                      <div className="month-row-strip" style={{gridTemplateRows:'28px'}}>
                        {Array.from({length:31}).map((_,i) => (
                          <div key={i} className="year-day-num" style={{gridColumn:i+1}}>{i+1}</div>
                        ))}
                      </div>
                    </div>
                    {monthList.map(({year, month}) => (
                      <MonthRow key={`${year}-${month}`} year={year} month={month} events={events} />
                    ))}
                  </div>
                </React.Fragment>
              )}
            </React.Fragment>
          )}
        </React.Fragment>
      )}
    </div>
  );
}

/* ---------------- Tasks Tab ---------------- */
function TasksTab({ frost, library, completedTasks, toggleTaskComplete, setTab }){
  const ready = frost.lastSpring && frost.firstFall;
  const rows = useMemo(() => computeCalendarRows(frost, library), [frost, library]);
  const tasks = useMemo(() => ready ? computeTaskBuckets(rows) : { overdue:[], dueNow:[], upcoming:[] }, [rows, ready]);
  const [showCompleted, setShowCompleted] = useState(false);

  const isDone = (t) => completedTasks.includes(t.id);
  const overdue = tasks.overdue.filter(t => !isDone(t));
  const dueNow = tasks.dueNow.filter(t => !isDone(t));
  const upcoming = tasks.upcoming.filter(t => !isDone(t));
  const completed = [...tasks.overdue, ...tasks.dueNow, ...tasks.upcoming].filter(isDone);

  return (
    <div>
      <h2 className="section-title">Tasks</h2>
      <p className="section-sub">What's overdue, due now, and coming up next for the plants in My Garden. Click a task to check it off — completed tasks drop off the board.</p>

      {library.length === 0 ? (
        <div className="empty">
          Nothing in My Garden yet — add plants from the{' '}
          <span style={{textDecoration:'underline', cursor:'pointer', color:'var(--forest)', fontWeight:600}} onClick={()=>setTab('library')}>
            Plant Library
          </span>{' '}
          to generate tasks.
        </div>
      ) : !ready ? (
        <div className="empty">
          Set your frost dates on the{' '}
          <span style={{textDecoration:'underline', cursor:'pointer', color:'var(--forest)', fontWeight:600}} onClick={()=>setTab('calendar')}>
            Planting Calendar
          </span>{' '}
          tab to generate tasks.
        </div>
      ) : (
        <React.Fragment>
          <div className="task-board">
            <div className="task-col overdue">
              <div className="task-col-head">Overdue <span className="task-count">{overdue.length}</span></div>
              {overdue.length === 0
                ? <div className="empty" style={{padding:0}}>Nothing overdue.</div>
                : overdue.map(t => <TaskCard key={t.id} t={t} done={false} onToggle={()=>toggleTaskComplete(t.id)} />)}
            </div>
            <div className="task-col duenow">
              <div className="task-col-head">Due Now <span className="task-count">{dueNow.length}</span></div>
              {dueNow.length === 0
                ? <div className="empty" style={{padding:0}}>Nothing due right now.</div>
                : dueNow.map(t => <TaskCard key={t.id} t={t} done={false} onToggle={()=>toggleTaskComplete(t.id)} />)}
            </div>
            <div className="task-col upcoming">
              <div className="task-col-head">Upcoming <span className="task-count">{upcoming.length}</span></div>
              {upcoming.length === 0
                ? <div className="empty" style={{padding:0}}>Nothing on the horizon.</div>
                : upcoming.map(t => <TaskCard key={t.id} t={t} done={false} onToggle={()=>toggleTaskComplete(t.id)} />)}
            </div>
          </div>

          {completed.length > 0 && (
            <div style={{marginTop:20}}>
              <span
                style={{fontSize:12.5, color:'var(--ink-soft)', textDecoration:'underline', cursor:'pointer', fontWeight:600}}
                onClick={()=>setShowCompleted(s=>!s)}
              >
                {showCompleted ? 'Hide' : 'Show'} {completed.length} completed
              </span>
              {showCompleted && (
                <div className="task-board" style={{marginTop:12}}>
                  <div className="task-col">
                    <div className="task-col-head">Completed <span className="task-count">{completed.length}</span></div>
                    {completed.map(t => <TaskCard key={t.id} t={t} done={true} onToggle={()=>toggleTaskComplete(t.id)} />)}
                  </div>
                </div>
              )}
            </div>
          )}
        </React.Fragment>
      )}
    </div>
  );
}

/* ---------------- Harvest Tab ---------------- */
function HarvestTab({ harvest, setHarvest, library }){
  const [plantId, setPlantId] = useState(library[0] ? library[0].id : '');
  const [date, setDate] = useState('');
  const [qty, setQty] = useState('');
  const [unit, setUnit] = useState('lbs');
  const [notes, setNotes] = useState('');

  const plantById = useMemo(() => Object.fromEntries(library.map(p=>[p.id,p])), [library]);

  useEffect(() => {
    if(!library.find(p => p.id === plantId) && library.length){
      setPlantId(library[0].id);
    }
  }, [library]);

  const addEntry = (e) => {
    e.preventDefault();
    if(!date || !qty || !plantId) return;
    setHarvest(prev => [...prev, { id: uid(), plantId, date, qty: parseFloat(qty), unit, notes }]);
    setQty(''); setNotes('');
  };
  const removeEntry = (id) => setHarvest(prev => prev.filter(h => h.id !== id));

  const totals = useMemo(() => {
    const map = {};
    harvest.forEach(h => {
      const key = `${h.plantId}|${h.unit}`;
      map[key] = (map[key]||0) + h.qty;
    });
    return Object.entries(map).map(([key, total]) => {
      const [pid, unit] = key.split('|');
      return { name: plantById[pid]?.name || pid, total, unit };
    });
  }, [harvest, plantById]);

  const sorted = [...harvest].sort((a,b) => new Date(b.date) - new Date(a.date));

  return (
    <div>
      <h2 className="section-title">Harvest Log</h2>
      <p className="section-sub">Track what came out of the garden and how much.</p>

      <form className="harvest-form" onSubmit={addEntry}>
        <div className="field">
          <label>Plant</label>
          <select value={plantId} onChange={e=>setPlantId(e.target.value)}>
            {library.map(p => <option key={p.id} value={p.id}>{p.name}{p.variety ? ` — ${p.variety}` : ''}</option>)}
          </select>
        </div>
        <div className="field">
          <label>Date</label>
          <input type="date" value={date} onChange={e=>setDate(e.target.value)} required />
        </div>
        <div className="field">
          <label>Qty</label>
          <input type="number" step="0.1" min="0" value={qty} onChange={e=>setQty(e.target.value)} required />
        </div>
        <div className="field">
          <label>Unit</label>
          <select value={unit} onChange={e=>setUnit(e.target.value)}>
            <option>lbs</option><option>oz</option><option>count</option><option>baskets</option>
          </select>
        </div>
        <button className="btn clay" type="submit">Log harvest</button>
      </form>

      {sorted.length === 0 ? (
        <div className="empty">No harvests logged yet.</div>
      ) : (
        <table className="harvest-table">
          <thead>
            <tr><th>Date</th><th>Plant</th><th>Amount</th><th>Notes</th><th></th></tr>
          </thead>
          <tbody>
            {sorted.map(h => (
              <tr key={h.id}>
                <td>{fmt(new Date(h.date + 'T00:00:00'))}</td>
                <td>{plantById[h.plantId]?.name || h.plantId}</td>
                <td>{h.qty} {h.unit}</td>
                <td>{h.notes || '—'}</td>
                <td><button className="del-btn" onClick={()=>removeEntry(h.id)}>remove</button></td>
              </tr>
            ))}
          </tbody>
        </table>
      )}

      {totals.length > 0 && (
        <div className="totals-strip">
          {totals.map((t,i) => (
            <div className="total-chip" key={i}>{t.name}: <b>{t.total}</b> {t.unit}</div>
          ))}
        </div>
      )}
    </div>
  );
}

/* ---------------- My Garden Tab ---------------- */
function GardenTab({ plannerName, beds, library, gardenPlantList, harvest, frost, completedTasks, removeFromGarden, setTab }){
  const plantById = useMemo(() => Object.fromEntries(library.map(p=>[p.id,p])), [library]);

  const stats = useMemo(() => {
    let plantedSquares = 0, totalSquares = 0;
    const varietyIds = new Set();
    beds.forEach(b => {
      totalSquares += b.rows * b.cols;
      Object.values(b.cells).forEach(cell => {
        if(cell){ plantedSquares++; varietyIds.add(cell.plantId); }
      });
    });
    return { plantedSquares, totalSquares, varietyCount: varietyIds.size, bedCount: beds.length };
  }, [beds]);

  const harvestTotals = useMemo(() => {
    const map = {};
    harvest.forEach(h => {
      const key = h.unit;
      map[key] = (map[key]||0) + h.qty;
    });
    return Object.entries(map);
  }, [harvest]);

  const frostReady = frost.lastSpring && frost.firstFall;
  const taskCounts = useMemo(() => {
    if(!frostReady || gardenPlantList.length === 0) return null;
    const rows = computeCalendarRows(frost, gardenPlantList);
    const buckets = computeTaskBuckets(rows);
    const notDone = (list) => list.filter(t => !completedTasks.includes(t.id)).length;
    return { overdue: notDone(buckets.overdue), dueNow: notDone(buckets.dueNow), upcoming: notDone(buckets.upcoming) };
  }, [frost, gardenPlantList, frostReady, completedTasks]);

  const bedSummaries = useMemo(() => beds.map(b => {
    const plantCounts = {};
    let filled = 0;
    Object.values(b.cells).forEach(cell => {
      if(!cell) return;
      filled++;
      plantCounts[cell.plantId] = (plantCounts[cell.plantId]||0) + 1;
    });
    const plants = Object.entries(plantCounts).map(([pid, count]) => ({ plant: plantById[pid], count })).filter(x=>x.plant);
    return { bed:b, filled, total:b.rows*b.cols, plants };
  }), [beds, plantById]);

  return (
    <div>
      <h2 className="section-title">My Garden</h2>
      <p className="section-sub">A quick look at everything happening in {plannerName}.</p>

      <div className="stat-strip">
        <div className="stat-card">
          <div className="stat-value">{stats.bedCount}</div>
          <div className="stat-label">Garden beds</div>
        </div>
        <div className="stat-card">
          <div className="stat-value">{stats.plantedSquares}/{stats.totalSquares}</div>
          <div className="stat-label">Squares planted</div>
        </div>
        <div className="stat-card">
          <div className="stat-value">{stats.varietyCount}</div>
          <div className="stat-label">Varieties growing</div>
        </div>
        <div className="stat-card accent">
          <div className="stat-value">{harvest.length}</div>
          <div className="stat-label">Harvests logged</div>
        </div>
      </div>

      {gardenPlantList.length > 0 && (
        <div className="panel" style={{marginBottom:20}}>
          <div style={{fontFamily:"'Fraunces',serif", fontWeight:600, fontSize:15, color:'var(--forest)', marginBottom:10}}>
            Plants in My Garden ({gardenPlantList.length})
          </div>
          <div className="bed-plant-chips">
            {gardenPlantList.map(p => (
              <div className="mini-chip" key={p.id} style={{cursor:'pointer'}} title="Click to remove from My Garden" onClick={()=>removeFromGarden(p.id)}>
                <span className="mini-swatch" style={{background:p.color}}></span>{p.name} ✕
              </div>
            ))}
          </div>
        </div>
      )}

      {taskCounts ? (
        <div className="task-snapshot">
          <div style={{fontFamily:"'Fraunces',serif", fontWeight:600, fontSize:16, color:'var(--forest)'}}>Tasks</div>
          <div style={{fontSize:13.5, color:'var(--ink-soft)'}}>
            <b style={{color:'var(--clay)'}}>{taskCounts.overdue}</b> overdue · <b style={{color:'#9A7A16'}}>{taskCounts.dueNow}</b> due now · <b style={{color:'var(--forest)'}}>{taskCounts.upcoming}</b> upcoming
          </div>
          <button className="btn ghost sm" style={{marginLeft:'auto'}} onClick={()=>setTab('tasks')}>View tasks</button>
        </div>
      ) : gardenPlantList.length === 0 ? (
        <div className="task-snapshot">
          <div style={{fontSize:13.5, color:'var(--ink-soft)'}}>Add plants to My Garden to see upcoming tasks.</div>
          <button className="btn ghost sm" style={{marginLeft:'auto'}} onClick={()=>setTab('library')}>Go to Library</button>
        </div>
      ) : (
        <div className="task-snapshot">
          <div style={{fontSize:13.5, color:'var(--ink-soft)'}}>Set your frost dates to see upcoming tasks.</div>
          <button className="btn ghost sm" style={{marginLeft:'auto'}} onClick={()=>setTab('calendar')}>Go to Calendar</button>
        </div>
      )}

      {harvestTotals.length > 0 && (
        <div className="totals-strip" style={{marginBottom:28}}>
          {harvestTotals.map(([unit, total], i) => (
            <div className="total-chip" key={i}>Total: <b>{total}</b> {unit}</div>
          ))}
        </div>
      )}

      <h2 className="section-title" style={{fontSize:20}}>Your Beds</h2>
      {bedSummaries.length === 0 ? (
        <div className="empty">
          No beds yet —{' '}
          <span style={{textDecoration:'underline', cursor:'pointer', color:'var(--forest)', fontWeight:600}} onClick={()=>setTab('beds')}>
            create your first one
          </span>.
        </div>
      ) : (
        <div className="bed-summary-grid">
          {bedSummaries.map(({bed, filled, total, plants}) => (
            <div key={bed.id} className="bed-summary-card" onClick={()=>setTab('beds')}>
              <h4>{bed.name}</h4>
              <div className="bed-summary-meta">{bed.rows}×{bed.cols} · {filled}/{total} squares planted</div>
              <div className="bed-fill-bar"><div className="bed-fill-bar-inner" style={{width:`${total ? (filled/total)*100 : 0}%`}}></div></div>
              {plants.length === 0 ? (
                <div className="empty" style={{padding:0, fontSize:12}}>Nothing planted yet.</div>
              ) : (
                <div className="bed-plant-chips">
                  {plants.map(({plant, count}) => (
                    <div className="mini-chip" key={plant.id}>
                      <span className="mini-swatch" style={{background:plant.color}}></span>{plant.name} ×{count}
                    </div>
                  ))}
                </div>
              )}
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
