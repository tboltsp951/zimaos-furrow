                        {Array.from({length:31}).map((_,i) => (
                          <div key={i} className="year-day-num" style={{gridColumn:i+1}}>{i+1}</div>
                        ))}
                      </div>
                    </div>
                    {monthList.map(({year, month}) => (
                      <MonthRow key={`${year}-${month}`} year={year} month={month} events={events} />
                    ))}
                  </div>
                </React.Fragment>
              )}
            </React.Fragment>
          )}
        </React.Fragment>
      )}
    </div>
  );
}

/* ---------------- Tasks Tab ---------------- */
function TasksTab({ frost, library, completedTasks, toggleTaskComplete, setTab }){
  const ready = frost.lastSpring && frost.firstFall;
  const rows = useMemo(() => computeCalendarRows(frost, library), [frost, library]);
  const tasks = useMemo(() => ready ? computeTaskBuckets(rows) : { overdue:[], dueNow:[], upcoming:[] }, [rows, ready]);
  const [showCompleted, setShowCompleted] = useState(false);

  const isDone = (t) => completedTasks.includes(t.id);
  const overdue = tasks.overdue.filter(t => !isDone(t));
  const dueNow = tasks.dueNow.filter(t => !isDone(t));
  const upcoming = tasks.upcoming.filter(t => !isDone(t));
  const completed = [...tasks.overdue, ...tasks.dueNow, ...tasks.upcoming].filter(isDone);

  return (
    <div>
      <h2 className="section-title">Tasks</h2>
      <p className="section-sub">What's overdue, due now, and coming up next for the plants in My Garden. Click a task to check it off — completed tasks drop off the board.</p>

      {library.length === 0 ? (
        <div className="empty">
          Nothing in My Garden yet — add plants from the{' '}
          <span style={{textDecoration:'underline', cursor:'pointer', color:'var(--forest)', fontWeight:600}} onClick={()=>setTab('library')}>
            Plant Library
          </span>{' '}
          to generate tasks.
        </div>
      ) : !ready ? (
        <div className="empty">
          Set your frost dates on the{' '}
          <span style={{textDecoration:'underline', cursor:'pointer', color:'var(--forest)', fontWeight:600}} onClick={()=>setTab('calendar')}>
            Planting Calendar
          </span>{' '}
          tab to generate tasks.
        </div>
      ) : (
        <React.Fragment>
          <div className="task-board">
            <div className="task-col overdue">
              <div className="task-col-head">Overdue <span className="task-count">{overdue.length}</span></div>
              {overdue.length === 0
                ? <div className="empty" style={{padding:0}}>Nothing overdue.</div>
                : overdue.map(t => <TaskCard key={t.id} t={t} done={false} onToggle={()=>toggleTaskComplete(t.id)} />)}
            </div>
            <div className="task-col duenow">
              <div className="task-col-head">Due Now <span className="task-count">{dueNow.length}</span></div>
              {dueNow.length === 0
                ? <div className="empty" style={{padding:0}}>Nothing due right now.</div>
                : dueNow.map(t => <TaskCard key={t.id} t={t} done={false} onToggle={()=>toggleTaskComplete(t.id)} />)}
            </div>
            <div className="task-col upcoming">
              <div className="task-col-head">Upcoming <span className="task-count">{upcoming.length}</span></div>
              {upcoming.length === 0
                ? <div className="empty" style={{padding:0}}>Nothing on the horizon.</div>
                : upcoming.map(t => <TaskCard key={t.id} t={t} done={false} onToggle={()=>toggleTaskComplete(t.id)} />)}
            </div>
          </div>

          {completed.length > 0 && (
            <div style={{marginTop:20}}>
              <span
                style={{fontSize:12.5, color:'var(--ink-soft)', textDecoration:'underline', cursor:'pointer', fontWeight:600}}
                onClick={()=>setShowCompleted(s=>!s)}
              >
                {showCompleted ? 'Hide' : 'Show'} {completed.length} completed
              </span>
              {showCompleted && (
                <div className="task-board" style={{marginTop:12}}>
                  <div className="task-col">
                    <div className="task-col-head">Completed <span className="task-count">{completed.length}</span></div>
                    {completed.map(t => <TaskCard key={t.id} t={t} done={true} onToggle={()=>toggleTaskComplete(t.id)} />)}
                  </div>
                </div>
              )}
            </div>
          )}
        </React.Fragment>
      )}
    </div>
  );
}

/* ---------------- Harvest Tab ---------------- */
function HarvestTab({ harvest, setHarvest, library }){
  const [plantId, setPlantId] = useState(library[0] ? library[0].id : '');
  const [date, setDate] = useState('');
  const [qty, setQty] = useState('');
  const [unit, setUnit] = useState('lbs');
  const [notes, setNotes] = useState('');

  const plantById = useMemo(() => Object.fromEntries(library.map(p=>[p.id,p])), [library]);

  useEffect(() => {
    if(!library.find(p => p.id === plantId) && library.length){
      setPlantId(library[0].id);
    }
  }, [library]);

  const addEntry = (e) => {
    e.preventDefault();
    if(!date || !qty || !plantId) return;
    setHarvest(prev => [...prev, { id: uid(), plantId, date, qty: parseFloat(qty), unit, notes }]);
    setQty(''); setNotes('');
  };
  const removeEntry = (id) => setHarvest(prev => prev.filter(h => h.id !== id));

  const totals = useMemo(() => {
    const map = {};
    harvest.forEach(h => {
      const key = `${h.plantId}|${h.unit}`;
      map[key] = (map[key]||0) + h.qty;
    });
    return Object.entries(map).map(([key, total]) => {
      const [pid, unit] = key.split('|');
      return { name: plantById[pid]?.name || pid, total, unit };
    });
  }, [harvest, plantById]);

  const sorted = [...harvest].sort((a,b) => new Date(b.date) - new Date(a.date));

  return (
    <div>
      <h2 className="section-title">Harvest Log</h2>
      <p className="section-sub">Track what came out of the garden and how much.</p>

      <form className="harvest-form" onSubmit={addEntry}>
        <div className="field">
          <label>Plant</label>
          <select value={plantId} onChange={e=>setPlantId(e.target.value)}>
            {library.map(p => <option key={p.id} value={p.id}>{p.name}{p.variety ? ` — ${p.variety}` : ''}</option>)}
          </select>
        </div>
        <div className="field">
          <label>Date</label>
          <input type="date" value={date} onChange={e=>setDate(e.target.value)} required />
        </div>
        <div className="field">
          <label>Qty</label>
          <input type="number" step="0.1" min="0" value={qty} onChange={e=>setQty(e.target.value)} required />
        </div>
        <div className="field">
          <label>Unit</label>
          <select value={unit} onChange={e=>setUnit(e.target.value)}>
            <option>lbs</option><option>oz</option><option>count</option><option>baskets</option>
          </select>
        </div>
        <button className="btn clay" type="submit">Log harvest</button>
      </form>

      {sorted.length === 0 ? (
        <div className="empty">No harvests logged yet.</div>
      ) : (
        <table className="harvest-table">
          <thead>
            <tr><th>Date</th><th>Plant</th><th>Amount</th><th>Notes</th><th></th></tr>
          </thead>
          <tbody>
            {sorted.map(h => (
              <tr key={h.id}>
                <td>{fmt(new Date(h.date + 'T00:00:00'))}</td>
                <td>{plantById[h.plantId]?.name || h.plantId}</td>
                <td>{h.qty} {h.unit}</td>
                <td>{h.notes || '—'}</td>
                <td><button className="del-btn" onClick={()=>removeEntry(h.id)}>remove</button></td>
              </tr>
            ))}
          </tbody>
        </table>
      )}

      {totals.length > 0 && (
        <div className="totals-strip">
          {totals.map((t,i) => (
            <div className="total-chip" key={i}>{t.name}: <b>{t.total}</b> {t.unit}</div>
          ))}
        </div>
      )}
    </div>
  );
}

/* ---------------- My Garden Tab ---------------- */
function GardenTab({ plannerName, beds, library, gardenPlantList, harvest, frost, completedTasks, removeFromGarden, setTab }){
  const plantById = useMemo(() => Object.fromEntries(library.map(p=>[p.id,p])), [library]);

  const stats = useMemo(() => {
    let plantedSquares = 0, totalSquares = 0;
    const varietyIds = new Set();
    beds.forEach(b => {
      totalSquares += b.rows * b.cols;
      Object.values(b.cells).forEach(cell => {
        if(cell){ plantedSquares++; varietyIds.add(cell.plantId); }
      });
    });
    return { plantedSquares, totalSquares, varietyCount: varietyIds.size, bedCount: beds.length };
  }, [beds]);

  const harvestTotals = useMemo(() => {
    const map = {};
    harvest.forEach(h => {
      const key = h.unit;
      map[key] = (map[key]||0) + h.qty;
    });
    return Object.entries(map);
  }, [harvest]);

  const frostReady = frost.lastSpring && frost.firstFall;
  const taskCounts = useMemo(() => {
    if(!frostReady || gardenPlantList.length === 0) return null;
    const rows = computeCalendarRows(frost, gardenPlantList);
    const buckets = computeTaskBuckets(rows);
    const notDone = (list) => list.filter(t => !completedTasks.includes(t.id)).length;
    return { overdue: notDone(buckets.overdue), dueNow: notDone(buckets.dueNow), upcoming: notDone(buckets.upcoming) };
  }, [frost, gardenPlantList, frostReady, completedTasks]);

  const bedSummaries = useMemo(() => beds.map(b => {
    const plantCounts = {};
    let filled = 0;
    Object.values(b.cells).forEach(cell => {
      if(!cell) return;
      filled++;
      plantCounts[cell.plantId] = (plantCounts[cell.plantId]||0) + 1;
    });
    const plants = Object.entries(plantCounts).map(([pid, count]) => ({ plant: plantById[pid], count })).filter(x=>x.plant);
    return { bed:b, filled, total:b.rows*b.cols, plants };
  }), [beds, plantById]);

  return (
    <div>
      <h2 className="section-title">My Garden</h2>
      <p className="section-sub">A quick look at everything happening in {plannerName}.</p>

      <div className="stat-strip">
        <div className="stat-card">
          <div className="stat-value">{stats.bedCount}</div>
          <div className="stat-label">Garden beds</div>
        </div>
        <div className="stat-card">
          <div className="stat-value">{stats.plantedSquares}/{stats.totalSquares}</div>
          <div className="stat-label">Squares planted</div>
        </div>
        <div className="stat-card">
          <div className="stat-value">{stats.varietyCount}</div>
          <div className="stat-label">Varieties growing</div>
        </div>
        <div className="stat-card accent">
          <div className="stat-value">{harvest.length}</div>
          <div className="stat-label">Harvests logged</div>
        </div>
      </div>

      {gardenPlantList.length > 0 && (
        <div className="panel" style={{marginBottom:20}}>
          <div style={{fontFamily:"'Fraunces',serif", fontWeight:600, fontSize:15, color:'var(--forest)', marginBottom:10}}>
            Plants in My Garden ({gardenPlantList.length})
          </div>
          <div className="bed-plant-chips">
            {gardenPlantList.map(p => (
              <div className="mini-chip" key={p.id} style={{cursor:'pointer'}} title="Click to remove from My Garden" onClick={()=>removeFromGarden(p.id)}>
                <span className="mini-swatch" style={{background:p.color}}></span>{p.name}{p.variety && <span className="var-sub"> · {p.variety}</span>} ✕
              </div>
            ))}
          </div>
        </div>
      )}

      {taskCounts ? (
        <div className="task-snapshot">
          <div style={{fontFamily:"'Fraunces',serif", fontWeight:600, fontSize:16, color:'var(--forest)'}}>Tasks</div>
          <div style={{fontSize:13.5, color:'var(--ink-soft)'}}>
            <b style={{color:'var(--clay)'}}>{taskCounts.overdue}</b> overdue · <b style={{color:'#9A7A16'}}>{taskCounts.dueNow}</b> due now · <b style={{color:'var(--forest)'}}>{taskCounts.upcoming}</b> upcoming
          </div>
          <button className="btn ghost sm" style={{marginLeft:'auto'}} onClick={()=>setTab('tasks')}>View tasks</button>
        </div>
      ) : gardenPlantList.length === 0 ? (
        <div className="task-snapshot">
          <div style={{fontSize:13.5, color:'var(--ink-soft)'}}>Add plants to My Garden to see upcoming tasks.</div>
          <button className="btn ghost sm" style={{marginLeft:'auto'}} onClick={()=>setTab('library')}>Go to Library</button>
        </div>
      ) : (
        <div className="task-snapshot">
          <div style={{fontSize:13.5, color:'var(--ink-soft)'}}>Set your frost dates to see upcoming tasks.</div>
          <button className="btn ghost sm" style={{marginLeft:'auto'}} onClick={()=>setTab('calendar')}>Go to Calendar</button>
        </div>
      )}

      {harvestTotals.length > 0 && (
        <div className="totals-strip" style={{marginBottom:28}}>
          {harvestTotals.map(([unit, total], i) => (
            <div className="total-chip" key={i}>Total: <b>{total}</b> {unit}</div>
          ))}
        </div>
      )}

      <h2 className="section-title" style={{fontSize:20}}>Your Beds</h2>
      {bedSummaries.length === 0 ? (
        <div className="empty">
          No beds yet —{' '}
          <span style={{textDecoration:'underline', cursor:'pointer', color:'var(--forest)', fontWeight:600}} onClick={()=>setTab('beds')}>
            create your first one
          </span>.
        </div>
      ) : (
        <div className="bed-summary-grid">
          {bedSummaries.map(({bed, filled, total, plants}) => (
            <div key={bed.id} className="bed-summary-card" onClick={()=>setTab('beds')}>
              <h4>{bed.name}</h4>
              <div className="bed-summary-meta">{bed.rows}×{bed.cols} · {filled}/{total} squares planted</div>
              <div className="bed-fill-bar"><div className="bed-fill-bar-inner" style={{width:`${total ? (filled/total)*100 : 0}%`}}></div></div>
              {plants.length === 0 ? (
                <div className="empty" style={{padding:0, fontSize:12}}>Nothing planted yet.</div>
              ) : (
                <div className="bed-plant-chips">
                  {plants.map(({plant, count}) => (
                    <div className="mini-chip" key={plant.id}>
                      <span className="mini-swatch" style={{background:plant.color}}></span>{plant.name}{plant.variety && <span className="var-sub"> · {plant.variety}</span>} ×{count}
                    </div>
                  ))}
                </div>
              )}
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
